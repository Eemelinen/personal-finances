name: personal-finances

x-database-url: &database-url postgres://${POSTGRES_USER:-finances}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-finances}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finances}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finances}
    # Bound to localhost only; the database is never exposed to the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: tools
    command: ["node_modules/.bin/tsx", "src/server/db/migrate.ts"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Helsinki}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?set AUTH_PASSWORD_HASH in .env (pnpm auth:hash)}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: tools
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Helsinki}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
