name: personal-finances

x-database-url: &database-url postgres://${POSTGRES_USER:-finances}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-finances}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finances}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finances}
    # Bound to localhost only; the database is never exposed to the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: tools
    command: ["node_modules/.bin/tsx", "src/server/db/migrate.ts"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Helsinki}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?set AUTH_PASSWORD_HASH in .env (pnpm auth:hash)}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Encrypts the bank session ids the connect flow stores (FIN-007).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      BANK_PROVIDER: ${BANK_PROVIDER:-enable_banking}
      # Enable Banking (FIN-006); the key path is inside the container, where
      # ./secrets is mounted read-only at /app/secrets.
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_PRIVATE_KEY_PATH: ${ENABLE_BANKING_PRIVATE_KEY_PATH:-./secrets/enable-banking.pem}
      ENABLE_BANKING_REDIRECT_URL: ${ENABLE_BANKING_REDIRECT_URL:-}
      ENABLE_BANKING_ENV: ${ENABLE_BANKING_ENV:-sandbox}
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: tools
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Helsinki}
      # Optional: closing prices (FIN-020); without it only FX rates update.
      PRICE_API_KEY: ${PRICE_API_KEY:-}
      # Optional: the Kraken sync and crypto prices (FIN-021). The worker
      # stores the Kraken key encrypted, so it then needs ENCRYPTION_KEY.
      KRAKEN_API_KEY: ${KRAKEN_API_KEY:-}
      KRAKEN_API_SECRET: ${KRAKEN_API_SECRET:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      BANK_PROVIDER: ${BANK_PROVIDER:-enable_banking}
      # Enable Banking (FIN-006); the key path is inside the container, where
      # ./secrets is mounted read-only at /app/secrets.
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_PRIVATE_KEY_PATH: ${ENABLE_BANKING_PRIVATE_KEY_PATH:-./secrets/enable-banking.pem}
      ENABLE_BANKING_REDIRECT_URL: ${ENABLE_BANKING_REDIRECT_URL:-}
      ENABLE_BANKING_ENV: ${ENABLE_BANKING_ENV:-sandbox}
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
