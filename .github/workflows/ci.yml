name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-deprecation
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    # The job name is the required status check in branch protection. Keep it stable:
    # Layers are steps of this job, not new jobs: L2 (F-002) is here, F-003 adds L3 (e2e).
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm harness:check
      - name: Unit tests
        run: pnpm test:unit
      # L2: Testcontainers starts a throwaway Postgres 18 on the runner's Docker.
      - name: Integration tests (L2)
        run: pnpm test:integration
      - name: Build
        run: pnpm build
